[project]
name = "hackathon-starter"
version = "1.0.0"
description = "Simple starter module for hackathon"
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv==1.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pypdf>=4.0.0",
    "xlrd>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["client.py"]
