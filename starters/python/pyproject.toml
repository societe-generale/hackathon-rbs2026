[project]
name = "foundry-starter"
version = "1.0.0"
description = "Simple starter module for Foundry API"
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv==1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["client.py"]
